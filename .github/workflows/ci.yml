name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  # Manual run against a live RAG API. Set the three secrets below first.
  eval:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    env:
      EVAL_TARGET_URL: ${{ secrets.EVAL_TARGET_URL }}
      EVAL_TARGET_TOKEN: ${{ secrets.EVAL_TARGET_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: >
          evalharness run
          --dataset datasets/example.jsonl
          --k 5
          --label ci
          --min-hit-rate 0.75
          --min-faithfulness 0.80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: results/ci.json
